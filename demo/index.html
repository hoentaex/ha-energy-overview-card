<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Energy Overview Card – Demo</title>
    <style>
      /* Catppuccin Latte / Mocha, as the author's HA themes */
      .light {
        --primary-text-color: #4c4f69; --secondary-text-color: #5c5f77; --card-background-color: #eff1f5; --ha-card-background: #eff1f5;
        --secondary-background-color: #e6e9ef; --divider-color: #ccd0da; --primary-color: #8839ef; --text-primary-color: #eff1f5;
        background: #dce0e8;
      }
      .dark {
        --primary-text-color: #cdd6f4; --secondary-text-color: #a6adc8; --card-background-color: #1e1e2e; --ha-card-background: #1e1e2e;
        --secondary-background-color: #181825; --divider-color: #313244; --primary-color: #cba6f7; --text-primary-color: #1e1e2e;
        background: #11111b;
      }
      body { margin: 0; font-family: Roboto, Inter, system-ui, sans-serif; }
      .bar { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 14px; background: #fff; border-bottom: 1px solid #ddd; }
      .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .col { padding: 20px; color: var(--primary-text-color); display: flex; flex-direction: column; gap: 16px; align-items: center; }
      .col > * { width: min(100%, 420px); }
      @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
    </style>
  </head>
  <body>
    <div class="bar">
      <label>Szenario
        <select id="scenario">
          <option value="sim">Simulation (jetzt)</option><option value="night">Netz versorgt Haus</option>
          <option value="noon">PV-Überschuss</option><option value="evening">Akku versorgt Haus</option>
          <option value="gridcharge">Netzladung</option>
        </select>
      </label>
      <label>Energiefluss
        <select id="style"><option value="ellipse">Ellipse</option><option value="house">Haus-Szene</option><option value="sankey">Energiebänder</option><option value="ring">Haus-Ring</option></select>
      </label>
      <label>Wetter
        <select id="weather">
          <option value="">nach Szenario</option><option>sunny</option><option>partlycloudy</option><option>cloudy</option>
          <option>rainy</option><option>snowy</option><option>fog</option><option>clear-night</option>
        </select>
      </label>
      <label><input type="checkbox" id="sky" /> Wetterhimmel (Bänder, Ring)</label>
      <label>Sprache <select id="lang"><option>de</option><option>en</option></select></label>
      <label><input type="checkbox" id="minimal" /> nur Energie-Dashboard (keine Optionen)</label>
    </div>
    <div class="cols">
      <div class="col light" id="light"></div>
      <div class="col dark" id="dark"></div>
    </div>
    <script type="module">
      // Stand-in for Home Assistant's ha-card: background, border and radius from the theme.
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML =
              "<style>:host{display:block;box-sizing:border-box;background:var(--ha-card-background);border:1px solid var(--divider-color);border-radius:var(--ha-card-border-radius,16px)}</style><slot></slot>";
          }
        },
      );
      await import("../dist/ha-energy-overview-card.js");
      import { CONFIG, makeHass } from "./mock.js";

      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const ui = { scenario: $("scenario"), lang: $("lang"), minimal: $("minimal"), style: $("style"), weather: $("weather"), sky: $("sky") };
      ui.scenario.value = q.get("scenario") || "sim";
      ui.style.value = q.get("style") || "ellipse";
      ui.weather.value = q.get("weather") || "";
      ui.sky.checked = q.get("sky") === "1";
      ui.lang.value = q.get("lang") || "de";
      ui.minimal.checked = q.get("minimal") === "1";

      const cards = [];
      const build = () => {
        cards.length = 0;
        for (const col of ["light", "dark"]) {
          const el = document.getElementById(col);
          el.replaceChildren();
          for (const type of ["energy-overview-card", "energy-overview-mini-card", "energy-overview-balance-card"]) {
            const card = document.createElement(type);
            const config = ui.minimal.checked ? {} : CONFIG;
            card.setConfig({
              type: `custom:${type}`,
              ...config,
              flow_style: ui.style.value,
              ...(ui.sky.checked ? { flow_background: "weather" } : {}),
              ...(q.get("view") ? { history_view: q.get("view") } : {}),
              ...(q.get("scene") ? { illustration_scene: q.get("scene") } : {}),
            });
            el.append(card);
            cards.push(card);
          }
        }
        update();
      };
      const update = () => {
        const hass = makeHass({ lang: ui.lang.value, scenario: ui.scenario.value, weather: ui.weather.value });
        // The dark column shows the night picture of the illustrated header (a dark theme means night).
        for (const c of cards) c.hass = c.closest("#dark") ? { ...hass, themes: { darkMode: true } } : hass;
      };
      ui.scenario.addEventListener("change", update);
      ui.lang.addEventListener("change", build);
      ui.style.addEventListener("change", build);
      ui.sky.addEventListener("change", build);
      ui.weather.addEventListener("change", update);
      ui.minimal.addEventListener("change", build);
      build();
      window.__demo = { update, build };
    </script>
  </body>
</html>
